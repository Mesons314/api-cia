spring.application.name=api-cia
server.port=8080

# PostgreSQL (instead of MySQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/api_analyzer
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Impact score weights
cia.weights.w1=1.00

# Static endpoint extraction
endpoint-extraction.enabled=true
endpoint-extraction.startup-enabled=false
endpoint-extraction.analyze-on-startup=false
endpoint-extraction.fail-on-startup-error=false
endpoint-extraction.include-extractor-endpoints=false
endpoint-extraction.source-root=
endpoint-extraction.project-id=aichat
endpoint-extraction.version=0.0.1-SNAPSHOT
endpoint-extraction.title=aichat API
endpoint-extraction.description=OpenAPI contract generated by static source parsing of aichat.
endpoint-extraction.servers[0]=/
